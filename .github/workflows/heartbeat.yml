name: Keep scheduled workflows active

on:
  schedule:
    - cron: "41 5 * * 1"

permissions: {}

concurrency:
  group: scheduled-workflow-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: true

      - name: Create heartbeat after 30 inactive days
        shell: bash
        run: |
          set -euo pipefail
          last_commit_epoch="$(git log -1 --format=%ct)"
          now_epoch="$(date +%s)"
          inactive_days="$(( (now_epoch - last_commit_epoch) / 86400 ))"
          if (( inactive_days < 30 )); then
            echo "Last default-branch commit was ${inactive_days} days ago; no heartbeat needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
