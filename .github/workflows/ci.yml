name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned tooling
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile publisher scripts
        run: python -m compileall -q scripts tests

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Validate repository contract
        run: python scripts/validate_project.py --root .

      - name: Lint F-Droid metadata
        env:
          FDROID_KEYSTORE_PATH: ${{ runner.temp }}/not-used-in-ci.p12
          FDROID_KEYSTORE_PASSWORD: not-used-in-ci
          FDROID_KEY_PASSWORD: not-used-in-ci
          FDROID_KEY_ALIAS: not-used-in-ci
          FDROID_APKSIGNER_PATH: /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner
        run: fdroid lint

      - name: Check installed dependencies
        run: python -m pip check
